<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient: Electric Indigo to Vivid Azure -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Arrow & Play Geometry Gradient -->
    <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>

    <!-- Accent Glow Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Subtle Premium Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.35" />
    </filter>

    <filter id="glyphShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Modern Squircle Container -->
  <rect x="10" y="10" width="108" height="108" rx="28" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Minimalist Inner Top Gloss -->
  <path d="M 10 38 C 10 22.5 22.5 10 38 10 L 90 10 C 105.5 10 118 22.5 118 38 C 118 46 95 62 10 50 Z" fill="#FFFFFF" opacity="0.12" />

  <!-- Video Play Silhouette merged into Download Core -->
  <!-- Upper Video Play Element (Centered, sleek rounded corners) -->
  <path d="M 52 28 L 78 44 C 80.5 45.5 80.5 48.5 78 50 L 52 66 C 49.5 67.5 47 66 47 63 L 47 31 C 47 28 49.5 26.5 52 28 Z" fill="#FFFFFF" opacity="0.28" />

  <!-- Innovator Download Arrow (Streamlined Minimalist Geometry) -->
  <g filter="url(#glyphShadow)">
    <!-- Arrow Stem -->
    <rect x="56" y="34" width="16" height="34" rx="4" fill="url(#glyphGrad)" />
    
    <!-- Arrow Head Pointing Down -->
    <path d="M 38 62 L 64 88 L 90 62 C 92 60 90.5 57 88 57 L 76 57 L 76 57 L 52 57 L 40 57 C 37.5 57 36 60 38 62 Z" fill="url(#glyphGrad)" />
  </g>

  <!-- Minimalist Media Arc / Receiver Tray -->
  <path d="M 36 94 C 44 101 84 101 92 94" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" filter="url(#glyphShadow)" />

  <!-- Minimalist Video Pulse / Active Indicator (Top-Right subtle dot) -->
  <circle cx="94" cy="34" r="5" fill="#38BDF8" filter="url(#glyphShadow)" />
</svg>
